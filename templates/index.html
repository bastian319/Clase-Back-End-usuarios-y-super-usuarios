<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Mi Sitio Web</title>
    <style>
        /* Estilos idénticos a los anteriores */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        .input-group { margin-bottom: 1.25rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        .input-group input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { width: 100%; background-color: #3498db; color: white; padding: 0.75rem; border: none; border-radius: 4px; cursor: pointer; }
        .btn:hover { background-color: #2980b9; }
        .error-msg { color: red; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Iniciar Sesión</h1>
        
        <!-- Formulario controlado por JavaScript -->
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Usuario o Correo</label>
                <input type="text" id="username" placeholder="ej. invitado o admin" required>
            </div>

            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn">Entrar</button>
            <p id="errorMsg" class="error-msg">Usuario o contraseña incorrectos</p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página recargue por defecto
            
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            // Simulación de roles para el ejemplo:
            if (user === 'invitado' && pass === '1234') {
                // Apunta a la ruta configurada en Django
                window.location.href = '/invitados/'; 
            } else if (user === 'admin' && pass === 'admin123') {
                // Apunta a la ruta de la página completa
                window.location.href = '/pagina/'; 
            } else {
                errorMsg.style.display = 'block';
            }
        });
    </script>

</body>
</html>
